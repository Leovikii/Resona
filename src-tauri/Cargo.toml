[package]
name = "resona"
version = "0.0.19"
description = "A local desktop audio player"
authors = ["Viki"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.89"

[lib]
name = "resona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "playback", "wav"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
lofty = "0.24.0"
hound = "3.5.1"
base64 = "0.22.1"
fastrand = "2.3.0"
lrc = "0.2.0"
subtp = "0.2.0"
encoding_rs = "0.8.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.8.3", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "2"
thiserror = "2"
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["win-system-proxy"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.44", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-version = "0.1.7"
