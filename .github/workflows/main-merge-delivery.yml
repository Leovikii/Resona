name: Main CI and delivery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.event_name == 'push' && 'main-delivery' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  pr-validation:
    name: PR validation
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: pr-validation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend and release-rule tests
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: Verify the third-party license report
        shell: pwsh
        run: |
          npm run licenses
          git diff --exit-code -- docs/THIRD_PARTY_LICENSES.md

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate release version
        run: node scripts/release-channel.mjs --base "${{ github.event.pull_request.base.sha }}"

  verify:
    name: Prepare delivery
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          package-manager-cache: false

      - name: Inspect the main version
        id: release
        run: node scripts/release-channel.mjs --base "${{ github.event.before }}"

  release:
    needs:
      - verify
    if: needs.verify.outputs.release == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Require updater signing configuration
        shell: pwsh
        env:
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESONA_UPDATER_PUBLIC_KEY)) {
            throw "Environment variable RESONA_UPDATER_PUBLIC_KEY is missing. Add it under Settings > Environments > release > Environment variables (not Secrets)."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Environment secret TAURI_SIGNING_PRIVATE_KEY is missing under Settings > Environments > release."
          }

      - name: Build signed Windows release
        env:
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:windows

      - name: Publish GitHub prerelease
        if: needs.verify.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          gh release create $env:TAG `
            "$bundle/Resona_$($env:VERSION)_windows_x64-setup.exe" `
            "$bundle/Resona_$($env:VERSION)_windows_x64-setup.exe.sig" `
            "$bundle/Resona_$($env:VERSION)_windows_x64-setup.json" `
            "$bundle/latest.json" `
            --prerelease `
            --target $env:MERGE_SHA `
            --title "Resona $($env:VERSION)" `
            --notes-file "docs/releases/$($env:VERSION).md"

      - name: Publish GitHub stable release
        if: needs.verify.outputs.prerelease == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          gh release create $env:TAG `
            "$bundle/Resona_$($env:VERSION)_windows_x64-setup.exe" `
            "$bundle/Resona_$($env:VERSION)_windows_x64-setup.exe.sig" `
            "$bundle/Resona_$($env:VERSION)_windows_x64-setup.json" `
            "$bundle/latest.json" `
            --latest `
            --target $env:MERGE_SHA `
            --title "Resona $($env:VERSION)" `
            --notes-file "docs/releases/$($env:VERSION).md"
