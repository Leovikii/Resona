name: Main CI and delivery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.event_name == 'push' && 'main-delivery' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  pr-validation:
    name: PR validation
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: pr-validation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend and release-rule tests
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: Verify generated branding
        run: |
          node scripts/generate-file-icon-sources.mjs --check
          node scripts/generate-windows-shell-icons.mjs --check
          node scripts/generate-nsis-artwork.mjs --check

      - name: Verify the third-party license report
        run: |
          npm run licenses
          git diff --exit-code -- docs/THIRD_PARTY_LICENSES.md

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate release version
        run: node scripts/release-channel.mjs --base "${{ github.event.pull_request.base.sha }}"

  verify:
    name: Prepare delivery
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          package-manager-cache: false

      - name: Inspect the main version
        id: release
        run: node scripts/release-channel.mjs --base "${{ github.event.before }}"

  release:
    needs:
      - verify
    if: needs.verify.outputs.release == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare the signed updater configuration
        env:
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-updater-config.mjs

      - name: Build and publish the signed Windows release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0, Node 24
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: Resona ${{ needs.verify.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: ${{ needs.verify.outputs.prerelease }}
          generateReleaseNotes: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Resona_[version]_[platform]_[arch][setup][ext]
          args: --bundles nsis --config src-tauri/target/updater.config.json
