name: PR CI and main delivery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RESONA_BUILD_NUMBER: ${{ github.run_number }}
  RESONA_BUILD_ATTEMPT: ${{ github.run_attempt }}
  RESONA_BUILD_SHA: ${{ github.sha }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-ci-{0}', github.event.pull_request.number) || 'main-delivery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: max

jobs:
  windows-validation:
    name: Windows validation
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, Node 24
        with:
          workspaces: src-tauri
          key: ${{ env.ImageVersion }}

      - name: Run frontend and release-rule tests
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: Verify generated branding
        run: |
          node scripts/generate-file-icon-sources.mjs --check
          node scripts/generate-windows-shell-icons.mjs --check
          node scripts/generate-nsis-artwork.mjs --check

      - name: Verify the third-party license report
        run: |
          npm run licenses
          git diff --exit-code -- docs/THIRD_PARTY_LICENSES.md

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate release version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release-channel.mjs --base "$BASE_SHA"

  linux-validation:
    name: Arch Linux validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 libayatana-appindicator alsa-lib openssl ffmpeg gtk-layer-shell polkit desktop-file-utils

      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          cache: npm

      - name: Fingerprint native build dependencies
        run: echo "RESONA_NATIVE_CACHE=$(pacman -Q | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, Node 24
        with:
          workspaces: src-tauri
          key: ${{ env.RESONA_NATIVE_CACHE }}

      - name: Build and test Linux
        run: |
          npm ci
          npm run test:linux
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked ffmpeg -- --ignored --test-threads=1
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          npm run build:linux -- --debug
          RESONA_PACKAGE_BINARY=src-tauri/target/debug/resona node scripts/test-arch-package.mjs

  validation:
    name: PR validation
    if: always() && github.event_name == 'pull_request'
    needs: [windows-validation, linux-validation]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both platform validations
        env:
          WINDOWS_RESULT: ${{ needs.windows-validation.result }}
          LINUX_RESULT: ${{ needs.linux-validation.result }}
        run: test "$WINDOWS_RESULT" = success && test "$LINUX_RESULT" = success

  verify:
    name: Prepare delivery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out the main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0, Node 24
        with:
          node-version: 26
          cache: npm

      - name: Check the version tag
        id: release
        run: node scripts/release-channel.mjs --base "${{ github.event.before }}"

  windows-build:
    name: Build signed Windows installer
    needs: [verify]
    if: needs.verify.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, Node 24
        with:
          workspaces: src-tauri
          key: ${{ env.ImageVersion }}
      - name: Build signed NSIS without publishing
        env:
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run release:windows
          node scripts/stage-windows.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-delivery
          path: src-tauri/target/delivery/*
          if-no-files-found: error
          retention-days: 7

  arch-build:
    name: Build Arch package
    needs: [verify]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - name: Install Arch build and package dependencies
        run: pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 libayatana-appindicator alsa-lib openssl gtk-layer-shell namcap desktop-file-utils polkit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          cache: npm
      - name: Fingerprint native build dependencies
        run: echo "RESONA_NATIVE_CACHE=$(pacman -Q | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, Node 24
        with:
          workspaces: src-tauri
          key: ${{ env.RESONA_NATIVE_CACHE }}
      - name: Build embedded frontend and stage package
        env:
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build:linux
          node scripts/package-arch.mjs
          pacman -Q > src-tauri/target/delivery/arch-packages.txt
          ldd src-tauri/target/release/resona | tee src-tauri/target/delivery/linked-libraries.txt
          if grep -q 'not found' src-tauri/target/delivery/linked-libraries.txt; then exit 1; fi
          desktop-file-validate packaging/arch/io.github.vki.resona.desktop
      - name: Package the compiled application as an ordinary user
        run: |
          useradd --create-home builder
          cp -a src-tauri/target/delivery/package /home/builder/package
          chown -R builder:builder /home/builder/package
          runuser -u builder -- bash -c 'cd /home/builder/package && makepkg --nodeps --cleanbuild --noconfirm'
          cp /home/builder/package/*.pkg.tar.zst /home/builder/package/PKGBUILD src-tauri/target/delivery/
      - name: Verify clean-container package installation and removal
        run: |
          pacman -U --noconfirm src-tauri/target/delivery/*.pkg.tar.zst
          test -x /usr/bin/resona
          test -f /usr/lib/Resona/icons/default-artwork.png
          desktop-file-validate /usr/share/applications/io.github.vki.resona.desktop
          for mime in audio/mpeg audio/vnd.wave audio/flac; do
            grep -F "$mime=io.github.vki.resona.desktop;" /usr/share/applications/mimeinfo.cache
          done
          ldd /usr/bin/resona | tee /tmp/resona-linked.txt
          if grep -q 'not found' /tmp/resona-linked.txt; then exit 1; fi
          pacman -Qk "$(sed -n 's/^pkgname=//p' src-tauri/target/delivery/PKGBUILD)"
          namcap src-tauri/target/delivery/*.pkg.tar.zst
          pacman -R --noconfirm "$(sed -n 's/^pkgname=//p' src-tauri/target/delivery/PKGBUILD)"
          test ! -e /usr/bin/resona
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-delivery
          path: |
            src-tauri/target/delivery/*.pkg.tar.zst
            src-tauri/target/delivery/PKGBUILD
            src-tauri/target/delivery/build.json
            src-tauri/target/delivery/arch-packages.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [verify, windows-build, arch-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-delivery'
          path: src-tauri/target/artifacts
      - name: Publish the version release
        env:
          GH_TOKEN: ${{ github.token }}
          RESONA_UPDATER_PUBLIC_KEY: ${{ vars.RESONA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/publish-release.mjs
